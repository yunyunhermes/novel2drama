{% extends "base.html" %}
{% block title %}导出 - novel2drama{% endblock %}
{% block page %}export{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">04 / EXPORT</p><h1>成片导出</h1><p class="muted">选择已确认段落，创建拼接任务并下载最终视频。</p></div></div>
<div class="panel">
  <div class="panel-title"><h2>已确认段</h2><div class="button-row"><button class="btn secondary btn-sm" data-action="open-create-export">+ 创建导出</button><button class="btn secondary btn-sm" data-action="refresh-exports">刷新</button></div></div>
  <div id="confirmed-segments" class="confirmed-list"><div class="loading">正在加载段落...</div></div>
</div>
<div class="panel inset">
  <div class="panel-title"><h2>导出任务</h2></div>
  <div id="export-list"><div class="loading">正在加载任务...</div></div>
</div>

<!-- 创建导出 Modal -->
<div class="modal-mask hidden" id="modal-create-export">
  <div class="modal">
    <div class="modal-head"><h2>创建导出</h2><button class="btn secondary btn-sm" data-close-modal>✕</button></div>
    <div class="modal-body">
      <form data-form="create-export">
        <label>导出标题<input name="title" required placeholder="第一集成片"></label>
        <label>分辨率<select name="resolution"><option value="1280x720">720p</option><option value="1920x1080">1080p</option><option value="3840x2160">4K</option></select></label>
        <label>帧率<select name="fps"><option value="24">24 fps</option><option value="30">30 fps</option></select></label>
        <p class="form-hint">默认导出全部已确认段；在「已确认段」可用 ↑↓ 调整拼接顺序再创建。</p>
        <button class="btn" type="submit">创建导出任务</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
