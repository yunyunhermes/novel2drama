<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}novel2drama{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css?v=20260831ep">
</head>
<body data-page="{% block page %}{% endblock %}" data-project-id="{{ project_id|default('') }}">
    <div class="shell">
        <header class="topbar"><a class="brand" href="/">novel2drama <span>制作工作台</span></a><nav><a href="/">项目</a>{% if project_id %}<a href="/projects/{{ project_id }}">当前项目</a>{% endif %}</nav></header>
        <main class="container">{% block content %}{% endblock %}</main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="/static/app.js?v=20260831ep"></script>
</body>
</html>
