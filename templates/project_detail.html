{% extends "base.html" %}
{% block title %}项目详情 - novel2drama{% endblock %}
{% block content %}
<div class="card">
    <h2>项目详情</h2>
    <div id="project-info" hx-get="/api/v1/projects/{{ project_id }}" hx-trigger="load">
        <p>加载中...</p>
    </div>
</div>

<div class="card">
    <h3>功能入口</h3>
    <p>
        <a href="/projects/{{ project_id }}/novels" class="btn">小说版本</a>
        <a href="/projects/{{ project_id }}/storyboard" class="btn">分镜编辑</a>
        <a href="/projects/{{ project_id }}/assets" class="btn">资产库</a>
        <a href="/projects/{{ project_id }}/export" class="btn">导出</a>
    </p>
</div>

<div class="card">
    <h3>任务列表</h3>
    <div id="job-list" hx-get="/api/v1/projects/{{ project_id }}/jobs" hx-trigger="load">
        <p>加载中...</p>
    </div>
</div>
{% endblock %}
