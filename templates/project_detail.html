{% extends "base.html" %}
{% block title %}项目详情 - novel2drama{% endblock %}
{% block page %}project-detail{% endblock %}
{% block content %}
<div id="project-info" class="loading">正在加载项目...</div>

<!-- 项目概览 -->
<section class="panel overview-panel">
  <div class="panel-title">
    <div><p class="eyebrow">OVERVIEW</p><h2>项目概览</h2></div>
    <div class="overview-tools">
      <span id="project-status" class="badge">草稿</span>
      <button class="btn secondary btn-sm" data-action="refresh-detail">刷新</button>
    </div>
  </div>
  <div id="project-overview" class="overview-grid">
    <div class="loading">正在加载概览...</div>
  </div>
</section>

<!-- 任务动态（收起到侧栏二级，可从侧栏「任务动态」进入） -->
<details class="jobs-drawer" id="jobs-drawer">
  <summary class="jobs-drawer-summary">任务动态 <span class="muted">点击展开查看生成任务</span></summary>
  <div class="panel inset">
    <div id="job-list" class="job-list">
      <div class="loading">正在加载任务...</div>
    </div>
  </div>
</details>
{% endblock %}
