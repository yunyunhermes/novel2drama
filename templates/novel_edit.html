{% extends "base.html" %}
{% block title %}小说版本 - novel2drama{% endblock %}
{% block page %}novel{% endblock %}
{% block content %}
<div class="page-heading">
  <div>
    <p class="eyebrow">01 / NOVEL</p>
    <h1>小说编辑</h1>
    <p class="muted">管理原稿版本，解析章节，选择当前用于分镜生成的版本。</p>
  </div>
</div>

<section class="split-layout">
  <div>
    <!-- 版本列表 -->
    <div class="panel">
      <div class="panel-title">
        <h2>版本列表</h2>
        <button class="btn secondary btn-sm" data-action="refresh-novels">刷新</button>
      </div>
      <div id="version-list" class="version-list">
        <div class="loading">正在加载版本...</div>
      </div>
    </div>

    <!-- 当前版本原文 -->
    <div class="panel" id="source-panel" style="display:none">
      <div class="panel-title">
        <h2>原文预览 <span id="source-meta" class="muted"></span></h2>
        <button class="btn secondary btn-sm" data-action="toggle-source">展开/收起</button>
      </div>
      <div id="source-viewer" class="source-viewer collapsed"></div>
    </div>

    <!-- 章节列表 -->
    <div class="panel" id="chapter-panel" style="display:none">
      <div class="panel-title">
        <h2>章节列表 <span id="chapter-meta" class="muted"></span></h2>
        <div>
          <button class="btn secondary btn-sm" data-action="parse-chapters">重新解析章节</button>
          <button class="btn secondary btn-sm" data-action="refresh-chapters">刷新</button>
        </div>
      </div>
      <div id="chapter-list">
        <div class="loading">正在加载章节...</div>
      </div>
    </div>
  </div>

  <!-- 新建版本 -->
  <aside class="panel">
    <div class="panel-title"><h2>新建版本</h2><span class="step">01</span></div>
    <form data-form="create-novel">
      <label>版本标题
        <input name="title" required placeholder="第一版原稿">
      </label>
      <label>导入文本文件（可选）
        <input type="file" id="novel-file" accept=".txt,.md,.text">
        <small class="muted">选择 .txt 文件自动填充到下方文本框</small>
      </label>
      <label>小说原文
        <textarea name="source_text" class="source-editor" required placeholder="粘贴或输入小说原文..."></textarea>
      </label>
      <div class="form-meta muted" id="novel-char-count">0 字</div>
      <button class="btn" type="submit">保存新版本</button>
    </form>
  </aside>
</section>
{% endblock %}
