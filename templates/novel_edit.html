{% extends "base.html" %}
{% block title %}小说版本 - novel2drama{% endblock %}
{% block page %}novel{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">01 / NOVEL</p><h1>小说编辑</h1><p class="muted">管理原稿版本，选择当前用于分镜生成的版本。</p></div><a class="btn secondary" href="/projects/{{ project_id }}">返回项目</a></div>
<section class="split-layout"><div><div class="panel-title"><h2>版本列表</h2><button class="btn secondary btn-sm" data-action="refresh-novels">刷新</button></div><div id="version-list" class="version-list"><div class="loading">正在加载版本...</div></div><div id="chapter-list" class="panel inset"><div class="panel-title"><h2>章节列表</h2></div><p class="muted">章节将在后端解析原稿后显示。</p></div></div><aside class="panel"><div class="panel-title"><h2>新建版本</h2><span class="step">01</span></div><form data-form="create-novel"><label>版本标题<input name="title" required placeholder="第一版原稿"></label><label>小说原文<textarea name="source_text" class="source-editor" required placeholder="粘贴或输入小说原文..."></textarea></label><button class="btn" type="submit">保存新版本</button></form></aside></section>
{% endblock %}
