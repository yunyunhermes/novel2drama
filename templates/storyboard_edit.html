{% extends "base.html" %}
{% block title %}分镜编辑 - novel2drama{% endblock %}
{% block page %}storyboard{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">02 / STORYBOARD</p><h1>分镜编辑</h1><p class="muted">按 15 秒段组织剧情、节拍与生成提示。左侧列出段落，右侧编辑段与节拍；需要时点「原文参考」对照全文。</p></div><div class="button-row"><button class="btn secondary" data-action="open-source-drawer">原文参考</button><button class="btn secondary" data-action="generate-storyboard">AI 生成分镜</button><button class="btn secondary" data-action="show-patches">待应用 patch</button><button class="btn secondary" data-action="refresh-storyboard">刷新</button></div></div>
<div id="patch-list" class="panel hidden"></div>

<!-- 原文参考抽屉：按需展开，不占横向列宽 -->
<aside class="source-ref drawer" id="source-ref" aria-hidden="true">
  <div class="drawer-head"><div class="sidebar-title">原文参考</div><button class="btn secondary btn-sm" data-action="close-source-drawer">收起</button></div>
  <div id="source-ref-viewer" class="source-ref-viewer"><div class="loading">加载中...</div></div>
  <div class="source-ref-foot"><span class="muted" id="source-ref-meta"></span></div>
</aside>
<div class="drawer-mask hidden" id="source-drawer-mask"></div>

<div class="storyboard-layout">
  <aside class="segment-sidebar">
    <div class="sidebar-title">段落列表</div>
    <div id="segment-menu" class="segment-menu"><div class="loading">加载中...</div></div>
    <button class="btn secondary btn-sm sidebar-add" data-action="show-create-segment">+ 新增段</button>
    <form data-form="create-segment" class="sidebar-form hidden" id="create-segment-form">
      <label>段编号<input type="number" name="sort_order" min="1" required></label>
      <label>剧情摘要<textarea name="summary" placeholder="这一段发生了什么"></textarea></label>
      <label>段首衔接<input name="start_transition" placeholder="接上一段"></label>
      <label>段尾衔接<input name="end_transition" placeholder="接下一段"></label>
      <button class="btn btn-sm" type="submit">创建</button>
    </form>
  </aside>
  <main class="segment-main">
    <div id="segment-detail" class="segment-detail"><div class="empty-state">请在左侧段落列表选择一段</div></div>
  </main>
</div>
{% endblock %}
